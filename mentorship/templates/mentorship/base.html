<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link
            rel="stylesheet"
            href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
            integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
            crossorigin="anonymous"
    />
    <link rel="shortcut icon" type="image/png" href="{% static 'mentorship/images/favicon.png' %}"/>
    <title>
        {{ page_title }}
    </title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        .footer {
            flex-shrink: 0;
            margin-top: auto;
            width: 100%;
        }
    </style>
</head>
<body class="bg-light">
    <main>
        <a href="{% url 'mentorship:index' %}">
            <img src="{% static 'mentorship/images/favicon.png' %}" width="300" height="300"/>
        </a>
        <div class="container p-5">
            {% block content %} {% endblock %}
        </div>
    </main>

    <footer class="text-center text-white footer">
        <div class="text-center text-white p-3 bg-secondary">
            © 2026 Copyright:
            <a class="text-white" href="https://www.acmedicalmentors.co.uk/">African Caribbean Medical Mentors</a> | ALL RIGHTS RESERVED |
            Registered charity number: 1190968
        </div>
    </footer>
</body>

</html>
